          <p><strong>Name:</strong> Lyric Santana</p>

              <input type="text" name="name" placeholder="Your name" required >

            </label>
            <label>
              Message
              <textarea name="message" rows="5" placeholder="Write a message here" required></textarea>
            </label>
            <button type="submit" class="button">Send</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
