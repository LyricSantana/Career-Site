<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Engineer | Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <div class="brand">Network Engineer</div>
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="job-market.html">Job Market</a>
          <a href="training.html">Training</a>
          <a href="job-description.html">Job Description</a>
          <a href="skills.html">Skills</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      <section class="page-heading">
        <p class="eyebrow">Contact &amp; Resume</p>
        <h1>Contact Me</h1>
      </section>

      <section class="two-column">
        <div class="card contact-card">
          <h2>My Information</h2>
          <p><strong>Name:</strong> Alex Student</p>
          <p><strong>Email:</strong> alexstudent@example.com</p>
          <p><strong>Phone:</strong> (555) 123-4567</p>
          <p><strong>Location:</strong> Midwest, USA</p>
          <a href="resume.pdf" class="button primary-button" target="_blank">Download Resume (PDF)</a>
        </div>

        <div class="card">
          <h2>Message Me</h2>
          <form class="contact-form">
            <label>
              Name
              <input type="text" name="name" placeholder="Your name" />
            </label>
            <label>
              Email
              <input type="email" name="email" placeholder="Your email" />
            </label>
            <label>
              Message
              <textarea name="message" rows="5" placeholder="Write a message here"></textarea>
            </label>
            <button type="submit" class="button">Send</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Career Site Project | Network Engineer</p>
    </footer>
  </body>
</html>
